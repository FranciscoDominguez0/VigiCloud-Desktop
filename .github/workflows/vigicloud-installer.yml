# SPDX-License-Identifier: GPL-2.0-or-later
# VigiCloud Windows installer based on Nextcloud Desktop v34.0.5 Windows CI.
name: VigiCloud Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
      PYTHON_VERSION: '3.12'
    steps:
      - name: Checkout VigiCloud
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve Craft dependency revisions
        id: craft-revisions
        shell: pwsh
        run: |
          function configValue($key) {
            $escapedKey = [regex]::Escape($key)
            $matches = @(Select-String -Path $env:CRAFT_MASTER_CONFIG -Pattern "^\s*$escapedKey\s*=\s*(.+?)\s*$")
            if ($matches.Count -ne 1) { throw "Expected one $key value in craftmaster.ini" }
            return $matches[0].Matches[0].Groups[1].Value.Trim()
          }
          function remoteRevision($repository, $ref) {
            $revision = git ls-remote $repository "refs/heads/$ref"
            if ($LASTEXITCODE -ne 0 -or !$revision) { throw "Could not resolve $ref from $repository" }
            return ($revision -split '\s+')[0]
          }
          $craftRevision = configValue 'CraftRevision'
          $kdeRef = configValue 'craft/craft-blueprints-kde.revision'
          $ncRef = configValue 'craft/craft-blueprints-nextcloud.revision'
          $kdeSha = remoteRevision 'https://github.com/nextcloud/craft-blueprints-kde.git' $kdeRef
          $ncSha = remoteRevision 'https://github.com/nextcloud/craft-blueprints-nextcloud.git' $ncRef
          @("kde_ref=$kdeRef", "nextcloud_ref=$ncRef", "key=$craftRevision-$kdeSha-$ncSha") |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore Craft dependencies
        id: craft-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ env.CRAFT_MASTER_CONFIG }}
            ${{ github.workspace }}\craft-clone
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: ${{ runner.os }}-vigicloud-craft-v1-${{ env.CRAFT_TARGET }}-python-${{ env.PYTHON_VERSION }}-${{ steps.craft-revisions.outputs.key }}

      - name: Install Craft and client dependencies
        if: steps.craft-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth=1 https://invent.kde.org/packaging/craftmaster.git "$env:CRAFT_MASTER_LOCATION"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clone CraftMaster' }
          function craft {
            python "$env:CRAFT_MASTER_LOCATION\CraftMaster.py" --config "$env:CRAFT_MASTER_CONFIG" --target "$env:CRAFT_TARGET" -c $args
            if ($LASTEXITCODE -ne 0) { throw "Craft failed: $args" }
          }
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|${{ steps.craft-revisions.outputs.kde_ref }}|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|${{ steps.craft-revisions.outputs.nextcloud_ref }}|"
          craft craft
          craft --install-deps nextcloud-client

      - name: Save Craft dependencies
        if: steps.craft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ env.CRAFT_MASTER_CONFIG }}
            ${{ github.workspace }}\craft-clone
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: ${{ runner.os }}-vigicloud-craft-v1-${{ env.CRAFT_TARGET }}-python-${{ env.PYTHON_VERSION }}-${{ steps.craft-revisions.outputs.key }}

      - name: Install Inkscape
        shell: pwsh
        run: |
          choco install inkscape -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inkscape installation failed' }

      - name: Verify VigiCloud SVG conversion before compilation
        shell: pwsh
        run: |
          $inkscape = 'C:\Program Files\Inkscape\bin\inkscape.exe'
          if (!(Test-Path $inkscape)) { $inkscape = (Get-Command inkscape.exe -ErrorAction Stop).Source }
          $svg = Join-Path $env:GITHUB_WORKSPACE 'theme\colored\VigiCloud-icon.svg'
          $out = Join-Path $env:RUNNER_TEMP 'vigicloud-icon-check.png'
          Write-Host "Inkscape: $inkscape"
          Write-Host "SVG: $svg"
          & $inkscape --version
          & $inkscape -w 64 -h 64 $svg -o $out 2>&1 | Out-Host
          $conversionExitCode = $LASTEXITCODE
          Write-Host "Conversion exit code: $conversionExitCode"
          if ($conversionExitCode -ne 0 -or !(Test-Path $out) -or (Get-Item $out).Length -eq 0) {
            throw 'VigiCloud SVG conversion failed. Review Inkscape messages above.'
          }
          Write-Host 'VigiCloud icon converted successfully.'

      - name: Set Craft PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\$env:CRAFT_TARGET\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile VigiCloud Desktop
        shell: pwsh
        run: |
          python "$env:CRAFT_MASTER_LOCATION\CraftMaster.py" --config "$env:CRAFT_MASTER_CONFIG" --target "$env:CRAFT_TARGET" -c --src-dir "$env:GITHUB_WORKSPACE" nextcloud-client
          if ($LASTEXITCODE -ne 0) { throw 'VigiCloud compilation failed' }

      - name: Verify compiled VigiCloud executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "$env:CRAFT_TARGET\bin\vigicloud.exe"
          if (!(Test-Path $exe)) {
            Write-Host "EXE files in Craft bin:"
            Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "$env:CRAFT_TARGET\bin") -Filter '*.exe' |
              Select-Object Name,Length,FullName | Format-Table -AutoSize
            throw "vigicloud.exe was not installed by CMake."
          }
          Write-Host "VigiCloud executable found: $exe"
          Write-Host "Size: $((Get-Item $exe).Length) bytes"

      - name: Adapt Craft packaging for VigiCloud
        shell: pwsh
        run: |
          $blueprint = Join-Path $env:GITHUB_WORKSPACE "$env:CRAFT_TARGET\etc\blueprints\locations\craft-blueprints-nextcloud\nextcloud-client\nextcloud-client.py"
          if (!(Test-Path $blueprint)) {
            throw "Nextcloud Craft blueprint not found: $blueprint"
          }

          $content = Get-Content $blueprint -Raw

          if ($content -notmatch '(?m)^import os$') {
            $content = $content.Replace("import info", "import os`nimport info")
          }

          $content = $content.Replace(
            'self.defines["appname"] = "nextcloud"',
            'self.defines["appname"] = "VigiCloud"'
          )
          $content = $content.Replace(
            'self.defines["company"] = "Nextcloud GmbH"',
            'self.defines["company"] = "VigiTec"'
          )
          $content = $content.Replace(
            'self.applicationExecutable = "nextcloud"',
            'self.applicationExecutable = "vigicloud"'
          )

          $content = $content.Replace(
            'self.displayName = "Nextcloud"',
            'self.displayName = "VigiCloud"'
          )

          if ($content -notmatch 'self\.applicationExecutable\s*=\s*"vigicloud"') {
            throw "Craft blueprint does not configure vigicloud as executable."
          }
          if ($content -notmatch 'self\.displayName\s*=\s*"VigiCloud"') {
            throw "Craft blueprint does not configure VigiCloud as display name."
          }

          $blacklist = Join-Path (Split-Path $blueprint) 'blacklist.txt'
          if (!(Test-Path $blacklist)) {
            throw "Craft blacklist not found: $blacklist"
          }

          $rules = Get-Content $blacklist -Raw
          $oldRule = 'bin/(?!(nextcloud|nextcloudcmd|QtWebEngineProcess)).*\.exe'
          $newRule = 'bin/(?!(vigicloud|vigicloudcmd|nextcloud|nextcloudcmd|QtWebEngineProcess)).*\.exe'

          if (!$rules.Contains($oldRule)) {
            throw 'Expected Craft executable blacklist rule not found.'
          }

          $rules = $rules.Replace($oldRule, $newRule)
          Set-Content -Path $blacklist -Value $rules -Encoding utf8
          Write-Host 'Craft blacklist updated to preserve vigicloud.exe.'

          Set-Content -Path $blueprint -Value $content -Encoding utf8

          python -m py_compile $blueprint
          if ($LASTEXITCODE -ne 0) {
            throw 'Craft blueprint patch failed'
          }

          Write-Host 'VigiCloud Craft packaging patch applied.'

      - name: Package Windows installer with NSIS
        shell: pwsh
        run: |
          python "$env:CRAFT_MASTER_LOCATION\CraftMaster.py" --config "$env:CRAFT_MASTER_CONFIG" --target "$env:CRAFT_TARGET" -c --package nextcloud-client
          if ($LASTEXITCODE -ne 0) { throw 'NSIS packaging failed' }

      - name: Collect generated Windows installers
        shell: pwsh
        run: |
          $target = Join-Path $env:GITHUB_WORKSPACE 'vigicloud-artifacts'
          New-Item -ItemType Directory -Path $target -Force | Out-Null

          $roots = @(
            (Join-Path $env:GITHUB_WORKSPACE "$env:CRAFT_TARGET\tmp"),
            'D:\_'
          )

          $files = @(
            foreach ($root in $roots) {
              if (Test-Path $root) {
                Get-ChildItem $root -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.Length -gt 10MB }
              }
            }
          )

          Write-Host '=== EXECUTABLES FOUND ==='
          $files | ForEach-Object {
            Write-Host "$($_.Length) bytes - $($_.FullName)"
          }

          $installers = @(
            $files | Where-Object {
              $_.FullName -notmatch '\\bin\\|\\dev-utils\\|\\image-' -and
              $_.Name -match '(?i)vigi|nextcloud|setup|installer'
            } | Sort-Object FullName -Unique
          )

          if ($installers.Count -ne 1) {
            throw "Expected one installer; found $($installers.Count). Review paths above."
          }

          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (!(Test-Path $sevenZip)) {
            throw "7-Zip not found: $sevenZip"
          }

          $inspectDir = Join-Path $env:RUNNER_TEMP 'vigicloud-inspect'
          New-Item -ItemType Directory -Path $inspectDir -Force | Out-Null

          & $sevenZip e $installers[0].FullName "-o$inspectDir" -y "*.7z"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not extract the installer payload.'
          }

          $payloads = @(Get-ChildItem $inspectDir -Filter '*.7z' -File)
          if ($payloads.Count -ne 1) {
            throw "Expected one embedded 7z payload, found $($payloads.Count)."
          }

          $contents = & $sevenZip l $payloads[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not inspect the embedded installer payload.'
          }

          $contents | Select-String 'vigicloud|nextcloud|craft.ico'

          if (-not ($contents | Select-String -Pattern '(?i)(^|[\\/])vigicloud\.exe(\s|$)')) {
            throw 'Embedded installer payload does not contain vigicloud.exe.'
          }

          Write-Host 'SUCCESS: vigicloud.exe exists inside installer payload.'

          Copy-Item $installers[0].FullName -Destination $target -Force
          Write-Host "Installer collected: $($installers[0].FullName)"

      - name: Upload VigiCloud installer
        uses: actions/upload-artifact@v4
        with:
          name: VigiCloud-Windows-Installer
          path: vigicloud-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14
